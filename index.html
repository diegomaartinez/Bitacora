<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#fbfbfa" />
    <title>Bitácora — diario de viaje con mapa y fotos en tu Google Drive</title>
    <meta
      name="description"
      content="Diario de viaje interactivo: marca los lugares por los que has pasado en un mapa y guarda sus fotos, todo directamente en tu Google Drive."
    />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Open Graph / redes sociales: al ser una SPA sin renderizado en servidor,
         estas etiquetas son genericas (no cambian por viaje concreto), pero ya
         mejoran mucho la vista previa al compartir un enlace por WhatsApp, etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bitácora" />
    <meta property="og:title" content="Bitácora — diario de viaje con mapa y fotos en tu Google Drive" />
    <meta
      property="og:description"
      content="Marca los lugares por los que has pasado en un mapa y guarda sus fotos, todo directamente en tu Google Drive."
    />
    <meta property="og:image" content="https://diegomaartinez.github.io/Bitacora/social-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://diegomaartinez.github.io/Bitacora/" />
    <meta property="og:locale" content="es_ES" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bitácora — diario de viaje con mapa y fotos en tu Google Drive" />
    <meta
      name="twitter:description"
      content="Marca los lugares por los que has pasado en un mapa y guarda sus fotos, todo directamente en tu Google Drive."
    />
    <meta name="twitter:image" content="https://diegomaartinez.github.io/Bitacora/social-preview.png" />

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
